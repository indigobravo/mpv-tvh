# ~/.config/mpv/mpv.conf

# Decode
hwdec=no
demuxer-lavf-o-add=analyzeduration=10000000
demuxer-lavf-o-add=probesize=10000000

# Cache — generous for live broadcast
cache=yes
demuxer-max-bytes=128MiB
demuxer-max-back-bytes=32MiB
demuxer-readahead-secs=20
cache-secs=20

# Audio — bigger buffer, fewer underruns
audio-buffer=0.5

# Deinterlace
deinterlace=yes
vf=bwdif=mode=send_frame

# Slightly-better-than-default scaling, cheap version
scale=lanczos
cscale=lanczos

# Audio/subs defaults
alang=eng
slang=eng
sub-auto=no
sub-visibility=no

# Suppress harmless MPEG-TS startup noise
msg-level=ffmpeg=fatal

# Screenshot directory
screenshot-dir=~/Desktop
