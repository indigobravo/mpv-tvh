# --- Channels ---------------------------------------------------------------
# Pad keys 1-8 play channels 1-8 (the presets, or ~/.config/mpv-tvh/config.json's order)

F13         playlist-play-index 0                   # pad 1: channel 1
F14         playlist-play-index 1                   # pad 2: channel 2
F15         playlist-play-index 2                   # pad 3: channel 3
F16         playlist-play-index 3                   # pad 4: channel 4
F17         playlist-play-index 4                   # pad 5: channel 5
F18         playlist-play-index 5                   # pad 6: channel 6
F19         playlist-play-index 6                   # pad 7: channel 7
F20         playlist-play-index 7                   # pad 8: channel 8
Shift+F13   playlist-play-index 8                   # keyboard: channel 9

# --- Keyboard (the pad's knobs and layers go through Hammerspoon) ----------

UP          seek -5                                 # back 5s
DOWN        seek 5                                  # forward 5s
ENTER       script-message player-play              # play / pause (after STOP: play)

Alt+UP      script-message player-prev              # previous channel (a recording: back 30s)
Alt+DOWN    script-message player-next              # next channel (a recording: on 30s)
Alt+ENTER   script-binding select/select-playlist   # channel list
