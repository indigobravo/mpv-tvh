# --- Channels ---------------------------------------------------------------
# Pad keys 1-8 play channels 1-8, in the order listed in ~/.config/mpv-tvh/config.yml

F13         playlist-play-index 0                   # pad 1: channel 1
F14         playlist-play-index 1                   # pad 2: channel 2
F15         playlist-play-index 2                   # pad 3: channel 3
F16         playlist-play-index 3                   # pad 4: channel 4
F17         playlist-play-index 4                   # pad 5: channel 5
F18         playlist-play-index 5                   # pad 6: channel 6
F19         playlist-play-index 6                   # pad 7: channel 7
F20         playlist-play-index 7                   # pad 8: channel 8
Shift+F13   playlist-play-index 8                   # keyboard: channel 9

# --- Player controls (Alt + pad key) ----------------------------------------
# Alt+F14 / Alt+F15 are taken by macOS (Option + brightness keys).

Alt+F16     cycle mute                              # pad 4: mute this player
Alt+F17     screenshot                              # pad 5: screenshot
Alt+F18     ab-loop                                 # pad 6: A-B loop
Alt+F19     quit                                    # pad 7: quit
Alt+F20     cycle fullscreen                        # pad 8: fullscreen

# --- Knob 1 -----------------------------------------------------------------

UP          seek -5                                 # turn left: back 5s
DOWN        seek 5                                  # turn right: forward 5s
ENTER       script-message player-play              # press: play / pause (after STOP: play)

Alt+UP      script-message player-prev              # Alt + left: start of track / previous
Alt+DOWN    playlist-next                           # Alt + right: next channel
Alt+ENTER   script-binding select/select-playlist   # Alt + press: channel list
