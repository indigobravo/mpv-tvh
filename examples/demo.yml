# mpv-tvh demo: used when there's no ~/.config/mpv-tvh/config.yml.
#
# No Tvheadend: the TV plays test cards that mpv makes itself, the radio
# plays internet stations, YouTube starts on a live stream, and the CD
# and video players use ~/Music and its recordings folder. The windows
# are laid out for a MacBook Air (pixels, Retina): the stack down the
# left, the TV picture top right.
#
# To set it up for real, copy examples/config.yml to
# ~/.config/mpv-tvh/config.yml and add your Tvheadend server
# (https://tvheadend.org) and channels.

tvheadend:
  host: ""

tv:
  label: TV
  default: testcard
  mpv_opts:
    - --no-fullscreen
    - --geometry=1400x788+1980+33
    - --ytdl=no
  panel_opts:
    - --geometry=1816x182+40+417
  channels:
    - name: testcard
      title: TEST CARD
      url: "av://lavfi:smptehdbars=size=1280x720:rate=25[out0];sine=frequency=1000,volume=0.05[out1]"
    - name: pattern
      title: TEST PATTERN
      url: "av://lavfi:testsrc2=size=1280x720:rate=25[out0];sine=frequency=440:beep_factor=4,volume=0.1[out1]"
    - name: bars
      title: COLOUR BARS
      url: "av://lavfi:pal100bars=size=1280x720:rate=25[out0];anullsrc=r=48000:cl=stereo[out1]"

radio:
  label: Radio
  default: worldservice
  mpv_opts:
    - --force-window=yes
    - --geometry=1816x182+40+619
    - --no-border
    - --macos-app-activation-policy=accessory
    - --ytdl=no
  channels:
    - name: worldservice
      title: BBC World Service
      url: http://as-hls-ww-live.akamaized.net/pool_87948813/live/ww/bbc_world_service/bbc_world_service.isml/bbc_world_service-audio%3d96000.norewind.m3u8
    - name: groovesalad
      title: SomaFM Groove Salad
      url: https://ice1.somafm.com/groovesalad-128-mp3
    - name: dronezone
      title: SomaFM Drone Zone
      url: https://ice1.somafm.com/dronezone-128-mp3
    - name: radioparadise
      title: Radio Paradise
      url: https://stream.radioparadise.com/mp3-192

youtube:
  label: YouTube
  default: lofi
  mpv_opts:
    - --ytdl-format=bestvideo[height<=1080]+bestaudio/best
    - --hwdec=auto-safe
  panel_opts:
    - --geometry=1816x182+40+821
  channels:
    - name: lofi
      title: Lofi Girl
      url: https://www.youtube.com/watch?v=jfKfPfyJRdk

music:
  label: Music
  mpv_opts: []
  panel_opts:
    - --geometry=1816x182+40+1023

preamp:
  panel_opts:
    - --geometry=1816x364+40+33

video:
  label: Video
  mpv_opts: []
  panel_opts:
    - --geometry=1816x182+40+1225

recorder:
  panel_opts:
    - --geometry=1816x182+40+1427
