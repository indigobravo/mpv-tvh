# mpv-tvh configuration
#
# Copy to ~/.config/mpv-tvh/config.yml and edit. (Without one, mpv-tvh runs
# examples/demo.yml: test cards and internet radio, no Tvheadend.)
# (Override the location with the MPV_TVH_CONFIG environment variable.)
#
# `tvheadend` is the server; `tv`, `radio`, `youtube`, `music` and `video` are the
# players, used by the fish commands of the same name; `preamp` and `recorder` the
# units of those names. Positions are pixels on a MacBook Air (Retina) screen.
#
# Channels:
#   name:    short name you type (`tv bbc1`)
#   title:   shown in mpv and the playlist (defaults to name)
#   uuid:    Tvheadend channel UUID, or
#   url:     an internet stream or YouTube link (doesn't use the tuner, no guide)
#
# The first eight channels map to pad keys 1-8 (F13-F20).
# List Tvheadend channel UUIDs with:
#   curl -s 'http://HOST:9981/api/channel/grid?limit=500' | jq -r '.entries[] | "\(.uuid)  \(.name)"'

# Tvheadend's address and the TV and radio channels can instead be set up
# from the preamp (SETUP) and the guide (key 3: presets, key 4: streams); those are kept in
# ~/.config/mpv-tvh/presets.json and win over what's here. Internet stations
# (url:) here stay, after the presets.

tvheadend:
  host: 192.168.0.10:9981

tv:
  label: TV
  default: bbc1                  # the channel it starts on (`tv --default`), stopped: PLAY plays it
  # start: bbc1                  # or play this one straight away when it starts
  mpv_opts:
    - --no-fullscreen
    - --geometry=1400x788+1980+33   # pixels (Retina): the TV picture, top right
    - --ytdl=no
  panel_opts:                      # optional: TV control panel window (faceplate)
    - --geometry=1816x182+40+417   # the faceplate's size and place: under the preamp
  channels:
    - name: bbc1
      title: BBC ONE HD
      uuid: "0123456789abcdef0123456789abcdef"
    - name: bbc2
      title: BBC TWO HD
      uuid: "fedcba9876543210fedcba9876543210"

radio:
  label: Radio
  default: radio4                # the station it starts on, stopped
  # start: radio4                # or play this one straight away
  mpv_opts:
    - --force-window=yes
    - --geometry=1816x182+40+619   # the faceplate's size (pixels, Retina) and place: under the TV's
    - --no-border                  # no title bar; drag the panel to move it
    - --macos-app-activation-policy=accessory   # no Dock icon (the TV panel never has one)
    - --ytdl=no
  # vu_opts:                       # VU meter window; default: the TV picture's place
  #   - --geometry=1400x788+1980+33
  #   - --script-opts-append=vu-ref=-16   # fixed 0 VU (dBFS RMS); default follows the level
  channels:
    - name: radio4
      title: BBC Radio 4
      uuid: "00112233445566778899aabbccddeeff"
    - name: atlantic252
      title: Atlantic 252
      url: https://stream4.themediasite.co.uk:8042/

youtube:
  label: YouTube
  # default: lofi                  # played by the YT launcher key; none: start idle and paste links
  mpv_opts:
    - --ytdl-format=bestvideo+bestaudio/best   # best available; e.g. bestvideo[height<=1080]+bestaudio/best to cap it
    - --hwdec=auto-safe            # hardware decoding for 4K VP9 / AV1 (mpv.conf turns it off for TV)
    # - --geometry=1400x788+1980+851  # video window; default: the secondary slot, under the TV picture
  panel_opts:
    - --geometry=1816x182+40+821   # the faceplate's size; here below the radio
  # vu_opts:                       # VU meter window; default: the secondary slot, under the TV picture
  channels: []                     # favourite links, e.g.
  #   - name: lofi
  #     title: Lofi Girl
  #     url: https://www.youtube.com/watch?v=jfKfPfyJRdk

music:                             # the CD player: drop music on its playlist window, or use LIBRARY
  label: Music
  mpv_opts: []
  panel_opts:
    - --geometry=1816x182+40+1023  # the faceplate's size; here below YouTube's
  # list_opts:                     # playlist window; default: the secondary slot, under the TV picture
  # vu_opts:                       # VU meter window; default: the secondary slot, under the TV picture
  # library: ~/Music               # the music folder the LIBRARY key browses (default ~/Music)
  # library_opts:                  # library window; default: the bottom half of the screen
  #   - --geometry=100%x50%+0-0
  #   - --screen=1                 # which display, if you have more than one

preamp:                            # the PR-252 preamp: chooses which source you hear
  panel_opts:
    - --geometry=1816x364+40+33    # twice a faceplate's height; at the top of the stack

video:                             # the DV-252 video player (Alt + TV): files and recordings
  label: Video
  mpv_opts: []                     # the picture: defaults to the TV window's --geometry
  panel_opts:
    - --geometry=1816x182+40+1225  # the faceplate's size; here under the CD player
  # library: ~/Movies              # what LIBRARY browses; default: the recordings folder
  # library_opts:                  # library window; default: the bottom half of the screen

recorder:                          # the RC-252 recorder: records the preamp's REC OUT source
  panel_opts:
    - --geometry=1816x182+40+1427  # the faceplate's size; here at the bottom of the stack
  # folder: ~/Music/recordings     # default: recordings in the CD player's music folder
